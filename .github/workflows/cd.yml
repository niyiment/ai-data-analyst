name: CD

# Production deploy: runs only after CI succeeds on main (or manually), and deploys the
# exact commit CI tested. Order: DB roles + migrations -> Render API -> Vercel web -> smoke.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  migrate:
    name: Database roles and migrations
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Bootstrap least-privilege roles (idempotent)
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
          APP_RW_PASSWORD: ${{ secrets.APP_RW_PASSWORD }}
          ANALYST_RO_PASSWORD: ${{ secrets.ANALYST_RO_PASSWORD }}
        run: |
          psql "${DATABASE_URL_OWNER/+psycopg/}" -q \
            -v app_rw_password="$APP_RW_PASSWORD" \
            -v analyst_ro_password="$ANALYST_RO_PASSWORD" \
            -f infra/postgres/bootstrap-roles.sql
      - name: Alembic upgrade head (as the owner role; never set on Render)
        working-directory: api
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
        run: |
          uv sync --frozen
          uv run alembic upgrade head

  deploy-api:
    name: Deploy API to Render
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.API_PUBLIC_URL }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
    steps:
      - name: Sync secret env vars to Render (GitHub secrets are the source of truth)
        env:
          DATABASE_URL_APP: ${{ secrets.DATABASE_URL_APP }}
          DATABASE_URL_ANALYST: ${{ secrets.DATABASE_URL_ANALYST }}
          CLEANUP_SECRET: ${{ secrets.CLEANUP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOWED_ORIGIN: ${{ vars.WEB_PUBLIC_URL }}
        run: |
          for key in DATABASE_URL_APP DATABASE_URL_ANALYST CLEANUP_SECRET GEMINI_API_KEY ALLOWED_ORIGIN; do
            jq -n --arg v "${!key}" '{value: $v}' | curl -fsS -o /dev/null -X PUT \
              "https://api.render.com/v1/services/$SERVICE_ID/env-vars/$key" \
              -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
              --data-binary @-
            echo "synced $key"
          done
      - name: Trigger a deploy of the tested commit
        id: trigger
        run: |
          body=$(jq -n --arg sha "$DEPLOY_SHA" '{commitId: $sha, clearCache: "do_not_clear"}')
          deploy=$(curl -fsS -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            -d "$body")
          echo "id=$(echo "$deploy" | jq -r .id)" >> "$GITHUB_OUTPUT"
      - name: Wait until the deploy is live (max 15 min)
        env:
          DEPLOY_ID: ${{ steps.trigger.outputs.id }}
        run: |
          for _ in $(seq 1 90); do
            status=$(curl -fsS "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" | jq -r .status)
            echo "Render deploy $DEPLOY_ID: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Render" && exit 1
      - name: Health check
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "${{ vars.API_PUBLIC_URL }}/health"

  deploy-web:
    name: Deploy web to Vercel
    needs: deploy-api
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.WEB_PUBLIC_URL }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global vercel@64.2.0
      - name: Pull production settings and env (incl. API_BASE_URL)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt output
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  smoke:
    name: Production smoke test
    needs: deploy-web
    runs-on: ubuntu-latest
    env:
      WEB: ${{ vars.WEB_PUBLIC_URL }}
    steps:
      - name: Web app serves
        run: curl -fsS --retry 5 --retry-all-errors -o /dev/null "$WEB/"
      - name: Same-origin proxy reaches the API and database (creates a session)
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$WEB/api/v1/sessions")
          echo "POST /api/v1/sessions -> $code"
          test "$code" = "201"
      - name: Golden sets are listed
        run: curl -fsS "$WEB/api/v1/eval/sets" | jq -e 'map(.name) | index("retail_sales")'
