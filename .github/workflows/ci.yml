name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guardrails:
    name: Size & Layering Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check file and function size limits
        run: python scripts/check_limits.py
      - name: Check architectural layering
        run: python scripts/check_layering.py

  api:
    name: Backend (Lint, Type, Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # Same image, port, and throwaway local-dev credentials as docker-compose.yml,
      # so integration tests run against real migrations and analyst_ro grants.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_data_analyst
          POSTGRES_USER: app_owner
          POSTGRES_PASSWORD: local_owner_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U app_owner -d ai_data_analyst"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_OWNER: postgresql+psycopg://app_owner:local_owner_password@localhost:5433/ai_data_analyst
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src tests
      - name: Prepare database (roles + migrations)
        env:
          PGPASSWORD: local_owner_password
        run: |
          psql -h localhost -p 5433 -U app_owner -d ai_data_analyst -v ON_ERROR_STOP=1 -f ../infra/postgres/init-roles.sql
          uv run alembic upgrade head
      - name: Test (unit + PostgreSQL integration)
        run: uv run pytest

  web:
    name: Frontend (Format, Lint, Type, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build
