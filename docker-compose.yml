services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_data_analyst}
      POSTGRES_USER: ${POSTGRES_USER:-app_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_owner_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_owner} -d ${POSTGRES_DB:-ai_data_analyst}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL_APP: postgresql+psycopg://app_rw:local_app_rw_password@postgres:5432/ai_data_analyst
      DATABASE_URL_ANALYST: postgresql+psycopg://analyst_ro:local_analyst_ro_password@postgres:5432/ai_data_analyst
      GEMINI_API_KEY: ${GEMINI_API_KEY:-replace-me}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      CLEANUP_SECRET: ${CLEANUP_SECRET:-local-cleanup-secret}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"

volumes:
  pgdata:
